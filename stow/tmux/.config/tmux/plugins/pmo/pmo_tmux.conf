# Config
set -gF @pmo_self "#{current_file}"
source -F "#{d:current_file}/themes/#{@flavor}_tmux.conf"

# Save the theme background so we can toggle back to it
set -gF @pmo_saved_thm_bg "#{@thm_bg}"

# 1 = transparent/default, 0 = opaque/theme bg
set -ogq @pmo_alpha_mode "1"

# Runtime background used everywhere that should toggle
if-shell -F '#{==:#{@pmo_alpha_mode},1}' \
  'set -gq @pmo_bg default' \
  'set -gF @pmo_bg "#{@pmo_saved_thm_bg}"'

# Toggle transparent background with PREFIX + a
bind-key a \
  set -gF @pmo_alpha_mode '#{?#{==:#{@pmo_alpha_mode},1},0,1}' \; \
  source-file -F "#{@pmo_self}" \; \
  display-message "Alpha mode toggled"

# Menu styling options
set -ogq @menu_selected_style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# popups
%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@pmo_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "bg=#{@pmo_bg},fg=#{@pmo_accent_primary}"
%endif

set -g @pmo_color_claude "#D97757"
set -g @pmo_color_github "#3FB950"

# ---------------------------------------------------------------------------
# Status bar priorities
# ---------------------------------------------------------------------------
# When the centred window list needs room, the lowest number drops first.
# Only these numbers need editing. Equal numbers drop together.
#
# The list is centred, so dropping a field only frees room on its own side:
# each side follows this order among its own fields, and drops only what it must.
set -g @pmo_prio_mouse   1 # right, only when mouse is on
set -g @pmo_prio_zoom    2 # left, only when zoomed
set -g @pmo_prio_host    3 # right
set -g @pmo_prio_path    4 # left
set -g @pmo_prio_process 5 # left
set -g @pmo_prio_github  6 # right
set -g @pmo_prio_claude  7 # right
set -g @pmo_prio_time    8 # right
set -g @pmo_prio_session 9 # left
# The window list itself is never dropped.

# --- Calculations from the numbers above, no need to edit below this line ---

# Text of the current dir, used to both draw it and measure it
set -g @pmo_path_text "#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}"

# Columns each field takes, its separator included (" icon text " + "│").
# github and claude are fixed so a changing count doesn't make fields flicker:
# github fits " icon 12 " + the broken icon, claude fits " icon 100% "
set -g @pmo_w_session "#{e|+:5,#{n:session_name}}"
set -g @pmo_w_process "#{e|+:5,#{n:pane_current_command}}"
set -g @pmo_w_path "#{e|+:5,#{w:#{E:@pmo_path_text}}}"
set -g @pmo_w_zoom "#{?window_zoomed_flag,8,0}"
set -g @pmo_w_github "9"
set -g @pmo_w_claude "9"
set -g @pmo_w_host "#{e|+:5,#{n:host}}"
set -g @pmo_w_time "17"
set -g @pmo_w_mouse "#{?mouse,7,0}"

# Columns free on each side: the list is centred, so half of what it leaves
set -g @pmo_windows_width "#{w:#{W:#{E:window-status-format},#{E:window-status-current-format}}}"
set -g @pmo_room "#{e|/:#{e|-:#{client_width},#{E:@pmo_windows_width}},2}"

# Columns needed to keep a field: 1 gap to the windows, the field itself, and
# every field on its side that outlasts it (same or higher priority number)
set -g @pmo_need_session "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_session},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_session}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_session}},#{E:@pmo_w_path},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_session}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_process "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_process},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_process}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_process}},#{E:@pmo_w_path},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_process}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_path "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_path},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_path}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_path}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_path}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_zoom "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_zoom},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_zoom}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_zoom}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_zoom}},#{E:@pmo_w_path},0}}}"
set -g @pmo_need_github "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_github},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_github}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_github}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_github}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_github}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_claude "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_claude},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_claude}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_claude}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_claude}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_claude}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_host "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_host},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_host}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_host}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_host}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_host}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_time "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_time},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_time}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_time}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_time}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_time}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_mouse "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_mouse},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_mouse}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_mouse}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_mouse}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_mouse}},#{E:@pmo_w_time},0}}}"

# 1 if the field is drawn, else 0
set -g @pmo_show_session "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_session}}"
set -g @pmo_show_process "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_process}}"
set -g @pmo_show_path "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_path}}"
set -g @pmo_show_github "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_github}}"
set -g @pmo_show_claude "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_claude}}"
set -g @pmo_show_host "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_host}}"
set -g @pmo_show_time "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_time}}"
set -g @pmo_show_zoom "#{&&:#{window_zoomed_flag},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_zoom}}}"
set -g @pmo_show_mouse "#{&&:#{mouse},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_mouse}}}"

# Separators only go between two visible things, whatever has dropped:
# left, 1 if something is drawn before this field
set -g @pmo_before_process "#{E:@pmo_show_session}"
set -g @pmo_before_path "#{||:#{E:@pmo_show_process},#{E:@pmo_before_process}}"
set -g @pmo_before_zoom "#{||:#{E:@pmo_show_path},#{E:@pmo_before_path}}"
# right, 1 if something is drawn after this field
set -g @pmo_after_time "#{E:@pmo_show_mouse}"
set -g @pmo_after_host "#{||:#{E:@pmo_show_time},#{E:@pmo_after_time}}"
set -g @pmo_after_claude "#{||:#{E:@pmo_show_host},#{E:@pmo_after_host}}"
set -g @pmo_after_github "#{||:#{E:@pmo_show_claude},#{E:@pmo_after_claude}}"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?#{E:@pmo_show_session},#{?client_prefix,#{#[bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel},bold]  #S },#{#[bg=#{@pmo_bg},fg=#{@pmo_color_session}]  #S }},}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_process},#{E:@pmo_before_process}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_process},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_process}]  #{pane_current_command} },}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_path},#{E:@pmo_before_path}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_path},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_path}]  #{E:@pmo_path_text} },}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_zoom},#{E:@pmo_before_zoom}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_zoom},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_zoom}]  zoom },}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{E:@pmo_show_github},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_github}] 󰊤 #(~/.config/tmux/plugins/pmo/bin/github-commits.sh) },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_github},#{E:@pmo_after_github}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_claude},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_claude}] 󱚤 #(~/.config/tmux/plugins/pmo/bin/claude-usage.sh) },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_claude},#{E:@pmo_after_claude}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_host},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_host}] 󰇄 #H },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_host},#{E:@pmo_after_host}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_time},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_time}] 󰭦 %d/%m 󰅐 %H:%M },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_time},#{E:@pmo_after_time}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_mouse},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_mouse}] 󰍽 ON },}"

# Configure Tmux
set -g status-position top
set -gF status-style "bg=#{@pmo_bg}"
set -g status-justify "absolute-centre"
set -g status-interval 1

# Pane content look and feel
# Inactive panes are dimmed with a softer foreground color
set -gF window-style "fg=#{@thm_subtext_0},bg=#{@pmo_bg}"
set -gF window-active-style "fg=#{@thm_fg},bg=#{@pmo_bg}"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
# Active border uses Primary/Secondary accents
setw -g pane-active-border-style "bg=#{@pmo_bg},fg=#{?client_prefix,#{@pmo_accent_primary},#{@pmo_accent_secondary}}"
# Inactive border uses the new dedicated variable (blends with bg)
setw -gF pane-border-style "bg=#{@pmo_bg},fg=#{@pmo_border_inactive}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "_"

# Window flags (Icons only)
set -ogq @window_flags_icon_zoom " 󰁌" # Z
set -ogq @window_flags_icon_mark " 󰃀" # M
set -ogq @window_flags_icon_silent " 󰂛" # ~
set -ogq @window_flags_icon_activity " 󱅫" # #
set -ogq @window_flags_icon_bell " 󰂞" # !

# Inactive windows
set -g window-status-format "#{?window_bell_flag,#[bg=#{@pmo_accent_primary}]#[fg=#{@pmo_bg_panel}]#[bold],#{?window_last_flag,#{?client_prefix,#[fg=#{@pmo_accent_primary}],#[fg=#{@pmo_accent_secondary}]},#{?client_prefix,#[fg=#{@pmo_window_inactive_dim}],#[fg=#{@pmo_window_inactive}]}}#[bg=#{@pmo_bg}]} #I#{?#{!=:#{window_name},_},: #W,}#{?window_activity_flag,#{@window_flags_icon_activity},}#{?window_bell_flag,#{@window_flags_icon_bell},}#{?window_silence_flag,#{@window_flags_icon_silent},}#{?window_marked_flag,#{@window_flags_icon_mark},}#{?window_zoomed_flag,#{@window_flags_icon_zoom},} "
set -gF window-status-style "bg=#{@pmo_bg},fg=#{@thm_fg}"

# Last selected window
set -gF window-status-last-style "bg=#{@pmo_bg},fg=#{@pmo_accent_secondary}"

# Current window
set -g window-status-current-format "#{?client_prefix,#[bg=#{@pmo_accent_primary}],#[bg=#{@pmo_accent_secondary}]}#[fg=#{@pmo_bg_panel},bold] #I#{?#{!=:#{window_name},_},: #W,}#{?window_activity_flag,#{@window_flags_icon_activity},}#{?window_bell_flag,#{@window_flags_icon_bell},}#{?window_silence_flag,#{@window_flags_icon_silent},}#{?window_marked_flag,#{@window_flags_icon_mark},}#{?window_zoomed_flag,#{@window_flags_icon_zoom},} "
set -gF window-status-current-style "bg=#{@pmo_bg},fg=#{@thm_fg}"

set -gF window-status-activity-style "bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel}"
set -gF window-status-bell-style "bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel},bold"

# Separator
set -gF window-status-separator ""

# Mode style. This is used for copy mode highlighting to style the current selection.
set -gF mode-style "bg=#{@pmo_accent_primary},fg=#{@thm_crust},bold"
set -gF clock-mode-colour "#{@pmo_accent_secondary}"

# messages
set -gF message-style "fg=#{@pmo_accent_primary},bg=default"
set -gF message-command-style "fg=#{@pmo_accent_secondary},bg=default"

# Scroll bar, OFF otherwize it takes on char from history and make everything wrap around
%if "#{>=:#{version},3.6}"
  set -g pane-scrollbars off
  set -g pane-scrollbars-style "fg=#ffffff,bg=default,width=1,pad=0"
%endif

# menu
%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "#{E:@menu_selected_style}"
%endif
