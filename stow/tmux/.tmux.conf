# tmux config: everything is in this one file.
#
# Install: copy it to ~/.tmux.conf. Colours are built in, so nothing else is needed.
# Needs a Nerd Font for the icons. Tested on tmux 3.4 and 3.8.
# Status bar inspired by https://github.com/catppuccin/tmux
# and https://github.com/janoamaral/tokyo-night-tmux
#
# Optional extras, detected when the config loads and left out if missing:
#   ~/.config/tmux/themes/<name>_tmux.conf  overrides the colours, picked by @flavor
#   prefix + T theme picker                 needs the themes folder and fzf
#   ~/.config/tmux/bin/theme-preview.py     colour preview in the picker, needs python3
#   ~/.config/tmux/bin/github-commits.sh    commits of the day, needs gh (setup in the script)
#   ~/.config/tmux/bin/claude-usage.sh      Claude 5h usage, needs claude and its statusline
#   ~/.local/bin/braille-snake              prefix + b snake game

# =============================================================================
# Your settings
# =============================================================================

# Theme file to use from ~/.config/tmux/themes, if it exists
set -g @flavor 'tokyonight-night'

# Status bar priorities
# When the centred window list needs room, the lowest number drops first.
# Only these numbers need editing. Equal numbers drop together.
#
# The list is centred, so dropping a field only frees room on its own side:
# each side follows this order among its own fields, and drops only what it must.
set -g @pmo_prio_mouse   1 # right, only when mouse is on
set -g @pmo_prio_zoom    2 # left, only when zoomed
set -g @pmo_prio_host    3 # right
set -g @pmo_prio_path    4 # left
set -g @pmo_prio_process 5 # left
set -g @pmo_prio_github  6 # right
set -g @pmo_prio_claude  7 # right
set -g @pmo_prio_time    8 # right
set -g @pmo_prio_session 9 # left
# The window list itself is never dropped.
# To remove a field, add these two lines after the "1 if the field is drawn"
# block in the status bar section, using its name from the table:
#   set -g @pmo_show_host "0"
#   set -g @pmo_w_host "0"

# Fixed colours, the same in every theme
set -g @pmo_color_claude "#D97757"
set -g @pmo_color_github "#3FB950"

# =============================================================================
# Colours
# =============================================================================

# This file's location, for the bindings below that reload it
set -gF @pmo_self "#{current_file}"

# Built-in colours (Tokyo Night), so this file works on its own
set -g @thm_bg "#1a1b26"
set -g @thm_fg "#c0caf5"
set -g @thm_subtext_0 "#757c99"
set -g @thm_overlay_0 "#737994"
set -g @thm_crust "#232634"
set -g @pmo_accent_primary "#ff9e64"
set -g @pmo_accent_secondary "#2ac3de"
set -g @pmo_bg_panel "#2a2f41"
set -g @pmo_separator "#2a2f41"
set -g @pmo_border_inactive "#565f89"
set -g @pmo_window_inactive "#737aa2"
set -g @pmo_window_inactive_dim "#565f89"
set -g @pmo_color_session "#f7768e"
set -g @pmo_color_process "#9ece6a"
set -g @pmo_color_path "#73daca"
set -g @pmo_color_host "#bb9af7"
set -g @pmo_color_time "#7aa2f7"
set -g @pmo_color_zoom "#e0af68"
set -g @pmo_color_mouse "#e0af68"

# A theme file overrides them if there is one (-q: fine if it's missing).
# A theme chosen with prefix + T wins over @flavor and survives reloads.
source -qF "$HOME/.config/tmux/themes/#{?@flavor_picked,#{@flavor_picked},#{@flavor}}_tmux.conf"

# Save the theme background so we can toggle back to it
set -gF @pmo_saved_thm_bg "#{@thm_bg}"

# 1 = transparent/default, 0 = opaque/theme bg
set -ogq @pmo_alpha_mode "1"

# Runtime background used everywhere that should toggle
if-shell -F '#{==:#{@pmo_alpha_mode},1}' \
  'set -gq @pmo_bg default' \
  'set -gF @pmo_bg "#{@pmo_saved_thm_bg}"'

# Menu styling options
set -ogq @menu_selected_style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# popups
%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@pmo_bg},fg=#{@thm_fg}"
  set -gF popup-border-style "bg=#{@pmo_bg},fg=#{@pmo_accent_primary}"
%endif

# =============================================================================
# General
# =============================================================================

# Auto resize (if session open in different machine)
set-option -g window-size latest

# Disable auto rename windows
set-option -g allow-rename off

# No gaps in window numbers after closing one
set -g renumber-windows on

# History limit
set -g history-limit 50000

# Lock timeout after 4 hours
set-option -g lock-after-time 14400

# Enable vi copy mode
setw -g mode-keys vi

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Neovim recommandations
## Time to decide whether ESC is the Escape key or the start of a sequence.
## Not 0: over ssh a sequence can arrive split, and tmux then types its tail
## into the pane as stray text (e.g. "[?62;c" or "rgb:1a1a/1b1b/2626")
set-option -sg escape-time 10

# Default terminal inside tmux
set -g default-terminal "tmux-256color"

# Back to the defaults first, so the lists below don't grow on every reload
set -su terminal-features
set -su terminal-overrides

# Modern terminal capabilities (TrueColor, Cursor style, Underline styles/colors, Clipboard, Focus)
set -as terminal-features ',xterm*:RGB:cstyle:usstyle:clipboard'
set -as terminal-features ',wezterm*:RGB:cstyle:usstyle:clipboard'
set -as terminal-features ',*:hyperlinks'

# Extended keys, so apps can tell Shift+Enter, Ctrl+Enter... from plain Enter
# (Claude Code uses Shift+Enter for a new line)
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# Explicit Underline & Undercurl overrides
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Terminal Integration
set -g cursor-style blinking-block
set -g focus-events on
set -g set-clipboard on

# =============================================================================
# Key bindings
# =============================================================================

# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# mouse mode toggle
bind m set -g mouse on \; display " 󰍽 Mouse ON"
bind M set -g mouse off \; display " 󰍾 Mouse OFF"

# switch session
unbind-key S
bind-key S choose-tree -Zs

# use vim-like keys for splits and windows
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# use arrows for resizing (recommand use mouse for this)
bind Left resize-pane -L 5
bind Down resize-pane -D 5
bind Up resize-pane -U 5
bind Right resize-pane -R 5

# Vi copy mode
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode
bind-key -T copy-mode-vi 'C-y' send -X rectangle-toggle  # Switch selection vim/rectangle
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode

# Reload conf fast
bind r source-file -F "#{@pmo_self}" \; display "  Configuration Reloaded"

# Toggle transparent background with PREFIX + a
bind-key a \
  set -gF @pmo_alpha_mode '#{?#{==:#{@pmo_alpha_mode},1},0,1}' \; \
  source-file -F "#{@pmo_self}" \; \
  display-message "Alpha mode toggled"

# last pane, session and window
bind-key y last-pane
bind-key L switch-client -l
bind-key \; last-window

# Smart pane switching: detects local nvim, vim, fzf, AND container sessions (docker/podman)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|docker|podman)(diff)?(-wrapped)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Shows help (prefix+?) and session selector (prefix+S) in a bigger window than current plane by default
%if "#{>=:#{version},3.2}"
  unbind-key ?
  bind-key ? display-popup -E -w 90% -h 90% "tmux list-keys | less -R"
%else
  unbind-key ?
  bind-key ? new-window -n tmux-help "tmux list-keys | less"
%endif

# =============================================================================
# Status bar
# =============================================================================

# Optional fields, shown only if what they need is installed
set -g @pmo_has_github 0
if-shell 'test -x "$HOME/.config/tmux/bin/github-commits.sh" && command -v gh >/dev/null' 'set -g @pmo_has_github 1'
set -g @pmo_has_claude 0
if-shell 'test -x "$HOME/.config/tmux/bin/claude-usage.sh" && command -v claude >/dev/null' 'set -g @pmo_has_claude 1'

# Text of the current dir, used to both draw it and measure it
set -g @pmo_path_text "#{=/-32/...:#{s|^$USER$|~|:#{b:pane_current_path}}}"

# Columns each field takes, its separator included (" icon text " + "│").
# github and claude are fixed so a changing count doesn't make fields flicker:
# github fits " icon 12 " + the broken icon, claude fits " icon 100% "
set -g @pmo_w_session "#{e|+:5,#{n:session_name}}"
set -g @pmo_w_process "#{e|+:5,#{n:pane_current_command}}"
set -g @pmo_w_path "#{e|+:5,#{w:#{E:@pmo_path_text}}}"
set -g @pmo_w_zoom "#{?window_zoomed_flag,8,0}"
set -g @pmo_w_github "#{?@pmo_has_github,9,0}"
set -g @pmo_w_claude "#{?@pmo_has_claude,9,0}"
set -g @pmo_w_host "#{e|+:5,#{n:host}}"
set -g @pmo_w_time "17"
set -g @pmo_w_mouse "#{?mouse,7,0}"

# Columns free on each side: the list is centred, so half of what it leaves
set -g @pmo_windows_width "#{w:#{W:#{E:window-status-format},#{E:window-status-current-format}}}"
set -g @pmo_room "#{e|/:#{e|-:#{client_width},#{E:@pmo_windows_width}},2}"

# Columns needed to keep a field: 1 gap to the windows, the field itself, and
# every field on its side that outlasts it (same or higher priority number)
set -g @pmo_need_session "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_session},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_session}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_session}},#{E:@pmo_w_path},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_session}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_process "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_process},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_process}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_process}},#{E:@pmo_w_path},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_process}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_path "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_path},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_path}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_path}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_zoom},#{@pmo_prio_path}},#{E:@pmo_w_zoom},0}}}"
set -g @pmo_need_zoom "#{e|+:1,#{e|+:#{e|+:#{e|+:#{E:@pmo_w_zoom},#{?#{e|>=:#{@pmo_prio_session},#{@pmo_prio_zoom}},#{E:@pmo_w_session},0}},#{?#{e|>=:#{@pmo_prio_process},#{@pmo_prio_zoom}},#{E:@pmo_w_process},0}},#{?#{e|>=:#{@pmo_prio_path},#{@pmo_prio_zoom}},#{E:@pmo_w_path},0}}}"
set -g @pmo_need_github "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_github},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_github}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_github}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_github}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_github}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_claude "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_claude},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_claude}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_claude}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_claude}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_claude}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_host "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_host},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_host}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_host}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_host}},#{E:@pmo_w_time},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_host}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_time "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_time},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_time}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_time}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_time}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_mouse},#{@pmo_prio_time}},#{E:@pmo_w_mouse},0}}}"
set -g @pmo_need_mouse "#{e|+:1,#{e|+:#{e|+:#{e|+:#{e|+:#{E:@pmo_w_mouse},#{?#{e|>=:#{@pmo_prio_github},#{@pmo_prio_mouse}},#{E:@pmo_w_github},0}},#{?#{e|>=:#{@pmo_prio_claude},#{@pmo_prio_mouse}},#{E:@pmo_w_claude},0}},#{?#{e|>=:#{@pmo_prio_host},#{@pmo_prio_mouse}},#{E:@pmo_w_host},0}},#{?#{e|>=:#{@pmo_prio_time},#{@pmo_prio_mouse}},#{E:@pmo_w_time},0}}}"

# 1 if the field is drawn, else 0
set -g @pmo_show_session "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_session}}"
set -g @pmo_show_process "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_process}}"
set -g @pmo_show_path "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_path}}"
set -g @pmo_show_github "#{&&:#{@pmo_has_github},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_github}}}"
set -g @pmo_show_claude "#{&&:#{@pmo_has_claude},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_claude}}}"
set -g @pmo_show_host "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_host}}"
set -g @pmo_show_time "#{e|>=:#{E:@pmo_room},#{E:@pmo_need_time}}"
set -g @pmo_show_zoom "#{&&:#{window_zoomed_flag},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_zoom}}}"
set -g @pmo_show_mouse "#{&&:#{mouse},#{e|>=:#{E:@pmo_room},#{E:@pmo_need_mouse}}}"

# Separators only go between two visible things, whatever has dropped:
# left, 1 if something is drawn before this field
set -g @pmo_before_process "#{E:@pmo_show_session}"
set -g @pmo_before_path "#{||:#{E:@pmo_show_process},#{E:@pmo_before_process}}"
set -g @pmo_before_zoom "#{||:#{E:@pmo_show_path},#{E:@pmo_before_path}}"
# right, 1 if something is drawn after this field
set -g @pmo_after_time "#{E:@pmo_show_mouse}"
set -g @pmo_after_host "#{||:#{E:@pmo_show_time},#{E:@pmo_after_time}}"
set -g @pmo_after_claude "#{||:#{E:@pmo_show_host},#{E:@pmo_after_host}}"
set -g @pmo_after_github "#{||:#{E:@pmo_show_claude},#{E:@pmo_after_claude}}"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?#{E:@pmo_show_session},#{?client_prefix,#{#[bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel},bold]  #S },#{#[bg=#{@pmo_bg},fg=#{@pmo_color_session}]  #S }},}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_process},#{E:@pmo_before_process}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_process},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_process}]  #{pane_current_command} },}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_path},#{E:@pmo_before_path}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_path},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_path}]  #{E:@pmo_path_text} },}"
set -ga status-left "#{?#{&&:#{E:@pmo_show_zoom},#{E:@pmo_before_zoom}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-left "#{?#{E:@pmo_show_zoom},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_zoom}]  zoom },}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{E:@pmo_show_github},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_github}] 󰊤 #(~/.config/tmux/bin/github-commits.sh) },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_github},#{E:@pmo_after_github}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_claude},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_claude}] 󱚤 #(~/.config/tmux/bin/claude-usage.sh) },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_claude},#{E:@pmo_after_claude}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_host},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_host}] 󰇄 #H },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_host},#{E:@pmo_after_host}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_time},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_time}] 󰭦 %d/%m 󰅐 %H:%M },}"
set -ga status-right "#{?#{&&:#{E:@pmo_show_time},#{E:@pmo_after_time}},#{#[bg=#{@pmo_bg},fg=#{@pmo_separator},none]│},}"
set -ga status-right "#{?#{E:@pmo_show_mouse},#{#[bg=#{@pmo_bg},fg=#{@pmo_color_mouse}] 󰍽 ON },}"

# =============================================================================
# Windows, panes and messages
# =============================================================================

set -g status-position top
set -gF status-style "bg=#{@pmo_bg}"
set -g status-justify "absolute-centre"
set -g status-interval 1

# Pane content look and feel
# Inactive panes are dimmed with a softer foreground color
set -gF window-style "fg=#{@thm_subtext_0},bg=#{@pmo_bg}"
set -gF window-active-style "fg=#{@thm_fg},bg=#{@pmo_bg}"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
# Active border uses Primary/Secondary accents
setw -g pane-active-border-style "bg=#{@pmo_bg},fg=#{?client_prefix,#{@pmo_accent_primary},#{@pmo_accent_secondary}}"
# Inactive border uses the new dedicated variable (blends with bg)
setw -gF pane-border-style "bg=#{@pmo_bg},fg=#{@pmo_border_inactive}"
setw -g pane-border-lines single
# Otherwise tmux can colour only half the border in two pane windows
setw -gq pane-border-indicators off

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "_"

# Window flags (Icons only)
set -ogq @window_flags_icon_zoom " 󰁌" # Z
set -ogq @window_flags_icon_mark " 󰃀" # M
set -ogq @window_flags_icon_silent " 󰂛" # ~
set -ogq @window_flags_icon_activity " 󱅫" # #
set -ogq @window_flags_icon_bell " 󰂞" # !

# Inactive windows
set -g window-status-format "#{?window_bell_flag,#[bg=#{@pmo_accent_primary}]#[fg=#{@pmo_bg_panel}]#[bold],#{?window_last_flag,#{?client_prefix,#[fg=#{@pmo_accent_primary}],#[fg=#{@pmo_accent_secondary}]},#{?client_prefix,#[fg=#{@pmo_window_inactive_dim}],#[fg=#{@pmo_window_inactive}]}}#[bg=#{@pmo_bg}]} #I#{?#{!=:#{window_name},_},: #W,}#{?window_activity_flag,#{@window_flags_icon_activity},}#{?window_bell_flag,#{@window_flags_icon_bell},}#{?window_silence_flag,#{@window_flags_icon_silent},}#{?window_marked_flag,#{@window_flags_icon_mark},}#{?window_zoomed_flag,#{@window_flags_icon_zoom},} "
set -gF window-status-style "bg=#{@pmo_bg},fg=#{@thm_fg}"

# Last selected window
set -gF window-status-last-style "bg=#{@pmo_bg},fg=#{@pmo_accent_secondary}"

# Current window
set -g window-status-current-format "#{?client_prefix,#[bg=#{@pmo_accent_primary}],#[bg=#{@pmo_accent_secondary}]}#[fg=#{@pmo_bg_panel},bold] #I#{?#{!=:#{window_name},_},: #W,}#{?window_activity_flag,#{@window_flags_icon_activity},}#{?window_bell_flag,#{@window_flags_icon_bell},}#{?window_silence_flag,#{@window_flags_icon_silent},}#{?window_marked_flag,#{@window_flags_icon_mark},}#{?window_zoomed_flag,#{@window_flags_icon_zoom},} "
set -gF window-status-current-style "bg=#{@pmo_bg},fg=#{@thm_fg}"

set -gF window-status-activity-style "bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel}"
set -gF window-status-bell-style "bg=#{@pmo_accent_primary},fg=#{@pmo_bg_panel},bold"

# Separator
set -gF window-status-separator ""

# Mode style. This is used for copy mode highlighting to style the current selection.
set -gF mode-style "bg=#{@pmo_accent_primary},fg=#{@thm_crust},bold"
set -gF clock-mode-colour "#{@pmo_accent_secondary}"

# messages
# tmux 3.8 draws them over the status line and only fill clears it. fill=default
# leaves the status visible, so a transparent bg has to use fill=terminal
set -gF @pmo_message_fill "#{?#{==:#{@pmo_bg},default},terminal,#{@pmo_bg}}"
set -gF message-style "fg=#{@pmo_accent_primary},bg=#{@pmo_bg},fill=#{@pmo_message_fill}"
set -gF message-command-style "fg=#{@pmo_accent_secondary},bg=#{@pmo_bg},fill=#{@pmo_message_fill}"

# Scroll bar, OFF otherwize it takes on char from history and make everything wrap around
%if "#{>=:#{version},3.6}"
  set -g pane-scrollbars off
  set -g pane-scrollbars-style "fg=#ffffff,bg=default,width=1,pad=0"
%endif

# menu
%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "#{E:@menu_selected_style}"
  set -gF menu-style "bg=#{@pmo_bg},fg=#{@thm_fg}"
  set -gF menu-border-style "bg=#{@pmo_bg},fg=#{@pmo_accent_primary}"
%endif

# tmux 3.8 defaults these to a solid grey (themedarkgrey). -q since older versions
# don't know them. The tree border style also colours the choose-tree labels
set -gqF tree-mode-border-style "bg=#{@pmo_bg},fg=#{@pmo_border_inactive}"
set -gqF display-panes-border-style "bg=#{@pmo_bg},fg=#{@pmo_border_inactive}"
# Areas no pane covers, same default as tmux except for the inside background
set -gq fill-character "#{?is_inside,#[bg=#{@pmo_bg}] ,#[fg=themelightgrey]#[acs]~}"

# =============================================================================
# Optional extras
# =============================================================================

# Snake game, needs braille-snake. Quitting reloads this file to restore the status bar.
if-shell 'test -x "$HOME/.local/bin/braille-snake"' {
  bind b \
    set -g @snake_active 1 \; \
    set -g @snake_render '          ' \; \
    set -g status-right '#{?#{@snake_active},|#[fg=brightgreen]#{@snake_render}#[default]|,}' \; \
    set -g status-right-length 14 \; \
    run-shell 'sh -c "~/.local/bin/braille-snake -t init -c 12 -a >/dev/null 2>&1 &"' \; \
    switch-client -T snake \; \
    display-message 'Snake mode'

  bind -T snake Up    run-shell '~/.local/bin/braille-snake -t up >/dev/null 2>&1'    \; refresh-client -S \; switch-client -T snake
  bind -T snake Down  run-shell '~/.local/bin/braille-snake -t down >/dev/null 2>&1'  \; refresh-client -S \; switch-client -T snake
  bind -T snake Left  run-shell '~/.local/bin/braille-snake -t left >/dev/null 2>&1'  \; refresh-client -S \; switch-client -T snake
  bind -T snake Right run-shell '~/.local/bin/braille-snake -t right >/dev/null 2>&1' \; refresh-client -S \; switch-client -T snake
  bind -T snake r     run-shell '~/.local/bin/braille-snake -t restart >/dev/null 2>&1' \; refresh-client -S \; switch-client -T snake

  bind -T snake q \
    run-shell '~/.local/bin/braille-snake -t quit >/dev/null 2>&1' \; \
    set -gu @snake_active \; \
    set -gu @snake_render \; \
    source-file -F "#{@pmo_self}" \; \
    switch-client -T root \; \
    refresh-client -S \; \
    display-message 'Snake mode off'

  bind -T snake Escape \
    run-shell '~/.local/bin/braille-snake -t quit >/dev/null 2>&1' \; \
    set -gu @snake_active \; \
    set -gu @snake_render \; \
    source-file -F "#{@pmo_self}" \; \
    switch-client -T root \; \
    refresh-client -S \; \
    display-message 'Snake mode off'
}

# Bind 'prefix + T' to open a floating theme selector, needs the themes folder and fzf
if-shell 'test -d "$HOME/.config/tmux/themes" && command -v fzf >/dev/null' {
bind T display-popup -E -w 55% -h 65% -T " Select Theme " "sh -c '
  accent=\$(tmux show-option -gqv @pmo_accent_primary)
  [ -n \"\$accent\" ] || accent=214

  cd ~/.config/tmux/themes || exit 1

  theme=\$(
    ls *_tmux.conf | sed \"s/_tmux\\.conf$//\" | \
    fzf --ansi \
        --layout=reverse \
        --padding=1 \
        --prompt=\"Theme> \" \
        --color=\"prompt:\$accent,pointer:\$accent,marker:\$accent,spinner:\$accent,border:\$accent,preview-border:\$accent\" \
        --preview \"python3 \$HOME/.config/tmux/bin/theme-preview.py {}\" \
        --preview-window=\"right,50%,border-left,wrap\"
  ) &&
  [ -n \"\$theme\" ] &&
  tmux set -g @flavor_picked \"\$theme\" &&
  tmux source-file \"\$(tmux show-option -gqv @pmo_self)\" &&
  tmux display-message -d 700 \"Theme changed to \$theme\"
'"
}
