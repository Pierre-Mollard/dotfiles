"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyo-night-cyan"
add_newline = false
command_timeout = 1000

format = """\
[ ](bg:accent fg:black)$os${custom.os_version}$container$hostname\
[](fg:accent bg:bg_highlight)$directory\
[](fg:bg_highlight bg:bg)$git_branch$cmd_duration\
$line_break$character"""

# The zsh renderer tries these in order when the first line would wrap.
[profiles]
no_git = """\
[ ](bg:accent fg:black)$os${custom.os_version}$container$hostname\
[](fg:accent bg:bg_highlight)$directory\
[](fg:bg_highlight bg:bg)$cmd_duration$line_break$character"""
no_os = """\
[ ](bg:accent fg:black)$hostname\
[](fg:accent bg:bg_highlight)$directory\
[](fg:bg_highlight bg:bg)$cmd_duration$line_break$character"""
directory = """\
$directory[](fg:bg_highlight bg:bg)$cmd_duration$line_break$character"""
arrow = "$character"

[palettes.tokyo-night-cyan]
blue = '#7aa2f7'
cyan = '#7dcfff'
magenta = '#bb9af7'
green = '#9ece6a'
yellow = '#e0af68'
red = '#f7768e'
bg = '#1a1b26'
bg_highlight = '#292e42'
fg = '#c0caf5'
black = '#090c0c'
accent = '#2ac3de'

[custom.os_version]
command = "awk -F= '/^VERSION_ID=/{gsub(/\"/,\"\",$2); print $2}' /etc/os-release"
when = "test -f /etc/os-release"
style = "bg:accent fg:black"
format = '[$output ]($style)'

[os]
disabled = false
format = '[$symbol](bg:accent fg:black)'

[os.symbols]
Arch = "󰣇 "
Ubuntu = " "
Macos = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Fedora = "󰣛 "
CentOS = " "
AlmaLinux = " "
RockyLinux = " "
Debian = "󰣚 "
Alpine = " "
Mint = "󰣭 "
Windows = "󰍲 "
Linux = "󰌽 "

[hostname]
ssh_only = false
trim_at = '.'
format = '[$hostname ](bg:accent fg:black)'

# Keep container identity beside the OS, and collapse them together.
[container]
disabled = false
style = "bg:accent fg:black"
symbol = "󰏖"
format = '[$symbol $name ]($style)'

[directory]
style = "bg:bg_highlight fg:fg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:magenta bg:bg"
format = '[ $branch]($style)'

[cmd_duration]
min_time = 3000
style = "fg:yellow bg:bg"
format = '[ $duration]($style)'

# Also usable without the zsh renderer. The renderer preserves each mode's
# shape on failure, and detects ZLE visual/overwrite state explicitly.
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold accent)'
vimcmd_visual_symbol = '[◆](bold magenta)'
vimcmd_replace_symbol = '[▶](bold yellow)'
vimcmd_replace_one_symbol = '[▶](bold yellow)'
