"$schema" = 'https://starship.rs/config-schema.json'

# Global Settings
palette = 'tokyo-night'
add_newline = true
command_timeout = 1000 # Increase timeout for slow git repos

# -----------------------------------------------
# Layout Structure:
# Left Side: OS, Host, Dir, Git, Container
# Fill: Empty space to push the rest to the right
# Right Side: Node, C, CMake, Dart, Execution Time, Exit Status
# New Line: Clean input prompt
# -----------------------------------------------
format = """\
[█](brightcyan)\
$os\
${custom.os_version}\
$hostname\
[](bg:bg_highlight fg:brightcyan)\
$directory\
[](bg:bg fg:bg_highlight)\
$git_branch\
$git_status\
$container\
[](fg:bg)\
$fill\
[](fg:bg)\
$rust\
$c\
$cmake\
$nodejs\
$bun\
$deno\
$python\
$lua\
$golang\
$zig\
$dart\
$package\
$docker_context\
$cmd_duration\
$status\
[](bg:bg fg:bg_highlight)\
$time\
[](bg:bg_highlight fg:brightcyan)\
$jobs\
$shlvl\
$sudo\
[█](brightcyan)\
$line_break\
$character"""

# -----------------------------------------------
# Color Palette (Tokyo Night)
# -----------------------------------------------
[palettes.tokyo-night]
blue = '#7aa2f7'
cyan = '#7dcfff'
magenta = '#bb9af7'
green = '#9ece6a'
yellow = '#e0af68'
orange = '#e69875'
red = '#f7768e'
bg = '#1a1b26'
bg_highlight = '#292e42'
fg = '#c0caf5'
black = '#090c0c'
brightcyan = '#2ac3de'
brightgreen = '#16C60C'
brightred = '#FF3B30'

[custom.os_version]
# The command reads /etc/os-release, finds VERSION_ID, and strips the quotes
command = "awk -F= '/^VERSION_ID=/{gsub(/\"/,\"\",$2); print $2}' /etc/os-release"
# This ensures it ONLY runs on Linux machines that have this file
when = "test -f /etc/os-release"
style = "bg:brightcyan fg:black"
format = '[$output ]($style)'

# -----------------------------------------------
# Left Side Modules
# -----------------------------------------------
[os]
disabled = false
format = '[$symbol](bg:brightcyan fg:black)'

# Shows the Arch Linux logo natively
[os.symbols]
Arch = "󰣇 "
Ubuntu = " "
Macos = " "
Redhat = "󱄛 "          # Standard Red Hat [web:145]
RedHatEnterprise = "󱄛 "  # RHEL 7, 8, 9, 10 [web:145]
Fedora = "󰣛 "          # Upstream Red Hat [web:145]
CentOS = " "          # Downstream Red Hat [web:145]
AlmaLinux = " "       # RHEL Clone
RockyLinux = " "      # RHEL Clone
Debian = "󰣚 "          # [web:145]
Alpine = " "          # Often used in Docker containers [web:145]
Mint = "󰣭 "            # [web:145]
Windows = "󰍲 "         # Useful if you ever use WSL [web:145]
Linux = "󰌽 "           # Fallback generic Tux penguin [web:145]

[username]
disabled = true

[hostname]
ssh_only = false
trim_at = '.'
format = '[$hostname ](bg:brightcyan fg:black)'
disabled = false

[directory]
style = "bg:bg_highlight fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:bg"
format = '[[ $symbol $branch ](fg:brightcyan bg:bg)]($style)'

[git_status]
style = "bg:bg"
ignore_submodules = true
format = ''

[container]
disabled = false
format = '[[ 󰏖 $name ](fg:yellow bg:bg)]($style)'

# -----------------------------------------------
# Center (Flex Space)
# -----------------------------------------------
[fill]
symbol = ' '

# -----------------------------------------------
# Right Side Modules
# -----------------------------------------------
[rust]
disabled = false
symbol = ' '
style = "bg:bg"
format = '[[ $symbol($version )](fg:orange bg:bg)]($style)'

[c]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:brightcyan bg:bg)]($style)'

[cmake]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:brightcyan bg:bg)]($style)'

[nodejs]
symbol = "󰎙 "
style = "bg:bg"
format = '[[ $symbol($version )](fg:green bg:bg)]($style)'

[bun]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:yellow bg:bg)]($style)'

[deno]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:blue bg:bg)]($style)'

[python]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:yellow bg:bg)]($style)'

[lua]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:blue bg:bg)]($style)'

[golang]
symbol = "󰟓 "
style = "bg:bg"
format = '[[ $symbol($version )](fg:cyan bg:bg)]($style)'

[zig]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:orange bg:bg)]($style)'

[dart]
symbol = " "
style = "bg:bg"
format = '[[ $symbol($version )](fg:cyan bg:bg)]($style)'

[package]
symbol = "󰏗 "
style = "bg:bg"
format = '[[ $symbol$version ](fg:magenta bg:bg)]($style)'

[docker_context]
symbol = " "
style = "bg:bg"
only_with_files = true
format = '[[ $symbol$context ](fg:blue bg:bg)]($style)'

[cmd_duration]
min_time = 2000
style = "bg:bg"
format = '[[  $duration ](fg:yellow bg:bg)]($style)'

[status]
disabled = false
success_symbol = ""
style = "bg:bg"
format = '[[  $int ](fg:red bg:bg)]($style)'

[time]
disabled = false
time_format = "%T" # 24-hour format: HH:MM:SS
format = '[  $time ](bg:bg_highlight fg:fg)'

[jobs]
disabled = false
symbol = "✦ "
threshold = 1 # Shows as soon as 1+ background job exists
style = "bg:brightcyan fg:black"
format = '[$symbol$number]($style)'

[shlvl]
disabled = true # Tmux makes it increase
symbol = " 󱆃"
threshold = 2 # Hidden in normal shell (level 1), shows when inside subshells/tmux/nested sessions
style = "bg:brightcyan fg:black"
format = '[$symbol$shlvl]($style)'

[sudo]
disabled = false
symbol = "  "
style = "bg:brightcyan fg:black"
format = '[$symbol]($style)'

# -----------------------------------------------
# The Prompt Line
# -----------------------------------------------
[character]
disabled = false
# Success arrow is now bright cyan (matches LazyVim's indentline color)
success_symbol = '[❯](bold brightgreen)'
error_symbol = '[❯](bold brightred)'
vimcmd_symbol = '[❮](bold brightcyan)'

# TODO: alternate line color to see clearly which line is which
# TODO: change theme to match tmux/nvim/zsh
